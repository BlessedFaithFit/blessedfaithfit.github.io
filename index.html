<head>
    <meta charset="UTF-8">

    <title>BlessedFaithFit</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Birds+of+Paradise&family=January+Night&display=swap" rel="stylesheet">
    <style>
        /* General Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'January Night', sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f4f4f4;
        }

        h1, h2, h3 {
            font-family: 'Bebas Neue', sans-serif;
        }

        img {
            max-width: 100%;
            height: auto;
        }

        /* Header */
        header {
            background: #222;
            color: #fff;
            text-align: center;
            padding: 20px;
        }

        header .logo {
            width: 150px;
            margin: 20px 0;
        }

        header .title {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 30px;
            font-size: 1.1rem;
        }

        nav ul li a {
            color: #fff;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        nav ul li a:hover {
            color: #f39c12;
        }

        /* Hero Section */
        .hero {
            background: url('assets/images/hero-bg.jpg') no-repeat center center/cover;
            color: #fff;
            padding: 100px 20px;
            text-align: center;
        }

        .hero h2 {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        .cta-button {
            background-color: #f39c12;
            padding: 10px 20px;
            font-size: 1.2rem;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .cta-button:hover {
            background-color: #e67e22;
        }

        /* TrustScore Section */
        .trustscore-container {
            display: flex;
            align-items: center;
            background: white;
            border-radius: 20px;
            padding: 4px 12px;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            max-width: fit-content;
            margin-top: 30px;
        }

        .trustscore-stars {
            display: flex;
            gap: 2px;
            margin-right: 6px;
        }

        .star-box {
            background: #00A650;
            height: 18px;
            justify-content: center;
            border-radius: 4px;
            width: 18px;
            display: flex;
            align-items: center;
        }

        .star-icon {
            width: 12px;
            height: 12px;
            fill: white;
        }

        .trustscore-text {
            white-space: nowrap;
        }

        /* Sections */
        section {
            padding: 50px 20px;
            text-align: center;
        }

        section h2 {
            font-size: 2rem;
            margin-bottom: 20px;
        }

        section p {
            font-size: 1.1rem;
            color: #555;
        }

        .fade-in {
            animation: fadeIn 2s ease-in-out;
        }

        /* Footer */
        footer {
            background-color: #222;
            color: #fff;
            text-align: center;
            padding: 20px;
        }

        footer .social-links {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        footer .social-links li a {
            color: #fff;
            font-size: 1.3rem;
            transition: color 0.3s ease;
        }

        footer .social-links li a:hover {
            color: #f39c12;
        }

        /* Animation */
        @keyframes fadeIn {
            0% {
                opacity: 0;
            }

            100% {
                opacity: 1;
            }
        }

        /* Media Queries */
        @media (max-width: 768px) {
            header .title {
                font-size: 2rem;
            }

            .hero h2 {
                font-size: 2.5rem;
            }

            .hero p {
                font-size: 1rem;
            }

            nav ul {
                flex-direction: column;
                gap: 20px;
            }

            section h2 {
                font-size: 1.8rem;
            }

            footer .social-links {
                flex-direction: column;
                gap: 10px;
            }
        }

        @media (max-width: 480px) {
            header .logo {
                width: 120px;
            }

            .cta-button {
                padding: 8px 16px;
            }
        }
    </style>
</head>
